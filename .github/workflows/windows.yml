name: Windows
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none

jobs:
  Build:
    runs-on: windows-latest
    if: github.repository_owner == 'myridia'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Rust          
        uses: actions-rs/toolchain@v1 
        with:
          toolchain: nightly 
          target: x86_64-pc-windows-gnu 

      - name: NSIS
        run: choco install nsis -y
        shell: pwsh
  
      - name: MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: > 
           mingw-w64-x86_64-pkg-config
           mingw-w64-x86_64-glib2
           mingw-w64-x86_64-gtk3
           mingw-w64-x86_64-pango
           mingw-w64-x86_64-cairo
           mingw-w64-x86_64-gdk-pixbuf2
           mingw-w64-x86_64-atk
           mingw-w64-x86_64-rust
           mingw-w64-x86_64-fribidi
           mingw-w64-x86_64-graphite2
           mingw-w64-x86_64-harfbuzz
           mingw-w64-x86_64-pixman
           mingw-w64-x86_64-libffi
      
     
      - name: Compile
        shell: msys2 {0}
        run: | 
          export PATH="$PATH:/c/Users/runneradmin/.cargo/bin"
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          cargo build --release 
       

      - name: DLLs
        shell: msys2 {0}
        run: |
          mingw64=/c/a/_temp/msys64/mingw64
          cp target/release/*.exe .
          ldd target/release/*.exe | grep mingw64 | awk '{print $3}' | xargs -I{} cp {} .
          
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            *.exe
            *.dll

      - name: Silent
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" silent.nsi
          
      - name: Release
        if: github.repository_owner == 'myridia'                  
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'target/release/autotext.exe'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true


          
    
   


        


        


 
     
