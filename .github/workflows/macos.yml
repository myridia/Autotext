name: Macos
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none

jobs:
  Build:
    runs-on: macos-15
    if: github.repository_owner == 'myridia'

    steps:
      - name: Install Rust
        run: |
          brew install llvm tree 
          brew install gtk+3 openssl pkg-config  
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add x86_64-apple-darwin
          rustup component add llvm-tools-preview
          cargo --version 
          
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile 
        run: |
          cargo build --release 
          # export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig"
          # cargo build --release  --target x86_64-apple-darwin 

      - name: CompileIntel
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1
          cargo build --release --target x86_64-apple-darwin
          

           
      - name: List
        run: |
          cd target
          tree . 
      - name: Rename
        run: |
          cp target/release/autotext autotext_macos.app
          # cp target/x86_64-apple-darwin/release/autotext autotext_macos_intel.app
          hdiutil create -volname "autotext_macos" -srcfolder "autotext_macos.app" -ov -format UDZO "autotext_macos.dmg"
          # hdiutil create -volname "autotext_macos_intel" -srcfolder "autotext_macos_intel.app" -ov -format UDZO "autotext_macos_intel.dmg"



      - name: Release Intel 
        if: github.repository_owner == 'myridiax'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'autotext_macos_intel.dmg'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true   

      - name: Release Silicon
        if: github.repository_owner == 'myridiax'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'autotext_macos.dmg'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true 

